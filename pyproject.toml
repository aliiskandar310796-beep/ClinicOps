[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicops-eudamed-os"
version = "0.1.0"
description = "ClinicOps public-source EUDAMED research toolkit"
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.8", "pyyaml>=6"]

[project.scripts]
clinicops-id-check = "clinicops_eudamed.cli:id_check"
clinicops-claim-check = "clinicops_eudamed.cli:claim_check"
clinicops-fleet-status = "clinicops_os.cli:fleet_status"
clinicops-rank-opportunities = "clinicops_os.cli:rank_opportunities"
clinicops-revenue-rank = "clinicops_os.cli:revenue_rank"
clinicops-experiments = "clinicops_os.cli:experiment_status"
clinicops-portfolio-report = "clinicops_os.cli:portfolio_report"
clinicops-portfolio-json = "clinicops_os.cli:portfolio_json"
clinicops-portfolio-validate = "clinicops_os.cli:portfolio_validate"
clinicops-pilot-preflight = "clinicops_os.cli:pilot_preflight"
clinicops-pilot-bundle = "clinicops_os.cli:pilot_bundle"
clinicops-pilot-review-prepare = "clinicops_os.review_cli:pilot_review_prepare"
clinicops-pilot-review-gate = "clinicops_os.review_cli:pilot_review_gate"
clinicops-pilot-verify = "clinicops_os.cli:pilot_verify"
clinicops-pilot-dry-run = "clinicops_os.cli:pilot_dry_run"
clinicops-delegation-proof = "clinicops_os.delegation_cli:delegation_proof"
clinicops-company-run = "clinicops_os.company_cli:company_run"
clinicops-outcome-control = "clinicops_os.outcome_cli:outcome_control"
clinicops-risk-control = "clinicops_os.risk_cli:risk_control"
clinicops-economic-validation = "clinicops_os.economic_cli:economic_validation"
clinicops-sales-swarm = "clinicops_os.sales_cli:sales_swarm"
clinicops-claims = "clinicops_os.cli:claims_status"
clinicops-publication-pack = "clinicops_os.cli:publication_pack"
clinicops-integrity-gate = "clinicops_os.integrity_cli:integrity_gate"
clinicops-integrity-review-prepare = "clinicops_os.integrity_cli:integrity_review_prepare"
clinicops-integrity-review-gate = "clinicops_os.integrity_cli:integrity_review_gate"
clinicops-integrity-verify = "clinicops_os.integrity_cli:integrity_verify"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/clinicops_os/integrity_gate.py" = ["ISC004"]
