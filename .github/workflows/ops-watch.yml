name: Ops Watch

# Trimmed 2026-11-16: the push trigger and the EUDAMED reachability canary job
# were removed. The canary's reachability probe had failed on every run since
# early November, and research/eudamed-public-api-reuse-review.md says repeated
# refusals from the public API must pause automated polling and trigger a review.
# The monthly EUDAMED Watch workflow is unchanged. Canary scripts stay in the
# repo; re-add the job only after that review.

on:
  workflow_dispatch:
  schedule:
    - cron: '13 6 * * 1'

permissions:
  contents: read

concurrency:
  group: clinicops-ops-watch
  cancel-in-progress: false

jobs:
  live-site-health:
    name: Live site health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Verify clinicops.dk over HTTPS
        run: python scripts/check_live_site.py

  evidence-freshness:
    name: Evidence freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Claim registry freshness
        run: python scripts/audit_claim_registry.py
      - name: Claim reference integrity
        run: python scripts/audit_claim_references.py
      - name: Governed content claim validation
        run: python scripts/validate_content_claims.py
