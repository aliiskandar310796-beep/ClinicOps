name: OSV Scan
# Dependency vulnerability scan (osv.dev database). Scheduled and manual only; not a
# merge gate. Uses the officially documented OSV-Scanner reusable workflow pinned to an
# existing release tag (the floating "@v2" action ref does not exist, which is why the
# previous scheduled run failed to resolve). A run that fails because it found a
# vulnerability is a genuine finding to triage, not a workflow defect.
on:
  workflow_dispatch:
  schedule:
    - cron: '29 5 * * 3'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        --recursive
        ./
