name: Full QA one-time
on:
  push:
    branches:
      - chatgpt/indexing-conversion-20260928
    paths:
      - .github/workflows/full-qa-once.yml
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright and chromium
        run: |
          npm install -g playwright@1
          npx playwright install --with-deps chromium
      - name: Run full QA
        run: qa/run.sh full
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-qa-once
          path: qa/out/
