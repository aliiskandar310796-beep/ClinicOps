name: Debug llms generator
on:
  push:
    branches:
      - chatgpt/seo-growth-alignment-20260927
    paths:
      - .github/workflows/debug-llms.yml

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Render and show diff
        run: |
          python scripts/render_llms_txt.py
          git --no-pager diff -- docs/llms.txt
