name: Validate skills
on:
  push:
    paths: ["skills/**"]
  pull_request:
    paths: ["skills/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 skills/validate_skills.py
