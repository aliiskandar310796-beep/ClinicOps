name: Integrity Gate

on:
  push:
  pull_request:

jobs:
  integrity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e .[dev]
      - name: Integrity Gate synthetic bundle
        run: |
          rm -rf /tmp/clinicops-integrity
          clinicops-integrity-gate examples/integrity_gate_case.example.json /tmp/clinicops-integrity > /tmp/integrity-report.json
          grep -q '"gate_status": "HOLD_FOR_HUMAN_DECISION"' /tmp/integrity-report.json
          test -s /tmp/clinicops-integrity/integrity_report.html
          test -s /tmp/clinicops-integrity/manifest.json
      - name: Integrity Gate review must fail closed
        run: |
          clinicops-integrity-review-prepare /tmp/clinicops-integrity > /tmp/integrity-review.json
          set +e
          clinicops-integrity-review-gate /tmp/integrity-review.json /tmp/clinicops-integrity > /tmp/integrity-review-fail.json
          status=$?
          set -e
          test "$status" -eq 2
          test ! -f /tmp/clinicops-integrity/review_gate.json
          test ! -f /tmp/clinicops-integrity/review_record.json
      - name: Synthetic review binding smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/integrity-review.json")
          d = json.loads(p.read_text())
          d.update({
              "human_reviewer": "Synthetic Reviewer",
              "reviewer_role": "RA/QA reviewer",
              "review_completed_on": "2026-09-14",
              "review_minutes": 12,
              "decision": "APPROVE",
              "notes": "Synthetic smoke review; finding disposition completed.",
              "evidence_population_reviewed": True,
              "authority_conflicts_reviewed": True,
              "change_propagation_findings_reviewed": True,
              "false_positive_risk_reviewed": True,
              "regulatory_judgement_not_automated": True,
              "release_interpretation_approved": True,
          })
          for finding_id in d.get("finding_dispositions", {}):
              d["finding_dispositions"][finding_id] = "CONFIRMED"
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY
          clinicops-integrity-review-gate /tmp/integrity-review.json /tmp/clinicops-integrity > /tmp/integrity-review-approved.json
          grep -q '"status": "REVIEW APPROVED"' /tmp/integrity-review-approved.json
          grep -q '"review_minutes": 12' /tmp/integrity-review-approved.json
          test -s /tmp/clinicops-integrity/review_record.json
          clinicops-integrity-verify /tmp/clinicops-integrity examples/integrity_gate_case.example.json --require-review > /tmp/integrity-verify.json
          grep -q '"status": "VERIFIED"' /tmp/integrity-verify.json
          grep -q '"clinicops_output_delivery_ready": true' /tmp/integrity-verify.json
      - name: Integrity Gate focused tests
        run: pytest -q tests/test_integrity_gate.py
