name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: ruff check src tests scripts
      - name: Revenue OS experiment contract
        run: clinicops-experiments examples/experiments.json > /tmp/clinicops-experiments.json
      - name: Agent five-gate contract
        run: python scripts/agent_gate.py examples/agent_tasks.json 2026-09-09 > /tmp/clinicops-agent-gate.json
      - name: Readiness score contract
        run: python scripts/validate_readiness_page.py
      - name: Public Transition Map sample
        run: python scripts/render_public_demo.py --check
      - name: Site metadata contract
        run: python scripts/validate_site_metadata.py
      - name: Sitemap contract
        run: python scripts/render_sitemap.py --check
      - name: Internal link contract
        run: python scripts/validate_internal_links.py
      - name: Standard paid-pilot preflight
        run: |
          clinicops-pilot-preflight examples/standard_pilot_preflight.example.json > /tmp/clinicops-pilot-preflight.json
          grep -q '"status": "ACTIVATED"' /tmp/clinicops-pilot-preflight.json
      - name: Client bundle smoke test
        run: |
          rm -rf /tmp/clinicops-pilot
          clinicops-pilot-bundle examples/portfolio.csv /tmp/clinicops-pilot 2026-09-09 > /tmp/clinicops-manifest.json
          test -s /tmp/clinicops-pilot/client_report.html
          test -s /tmp/clinicops-pilot/portfolio_report.json
          grep -q '"bundle_schema_version": "1.1"' /tmp/clinicops-manifest.json
      - name: Synthetic human-review gate packaging smoke (not delegation proof)
        run: |
          clinicops-pilot-review-prepare examples/standard_pilot_preflight.example.json /tmp/clinicops-pilot > /tmp/clinicops-review.json
          python -c 'import json; from pathlib import Path; p=Path("/tmp/clinicops-review.json"); d=json.loads(p.read_text()); d.update({"review_completed_on":"2026-09-11","evidence_population_confirmed":True,"warnings_and_information_gaps_reviewed":True,"material_derived_statements_reviewed":True,"structural_signals_separated_from_regulatory_judgement":True,"actor_role_distinctions_reviewed":True,"unsupported_facts_left_unresolved":True,"internal_only_notes_removed":True,"client_facing_interpretation_approved":True}); p.write_text(json.dumps(d, indent=2)+"\n")'
          clinicops-pilot-review-gate examples/standard_pilot_preflight.example.json /tmp/clinicops-review.json /tmp/clinicops-pilot > /tmp/clinicops-review-gate.json
          grep -q '"status": "REVIEW APPROVED"' /tmp/clinicops-review-gate.json
      - name: Client bundle integrity verification
        run: |
          clinicops-pilot-verify /tmp/clinicops-pilot examples/portfolio.csv > /tmp/clinicops-bundle-verify.json
          grep -q '"status": "VERIFIED"' /tmp/clinicops-bundle-verify.json
      - name: Delegation proof must reject public CI example
        run: |
          set +e
          clinicops-delegation-proof examples/delegation_proof.example.json > /tmp/clinicops-delegation-proof.json
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"status": "FOUNDER-INDEPENDENT EXECUTION NOT PROVEN"' /tmp/clinicops-delegation-proof.json
          grep -q 'CI or automated smoke executions cannot count as delegation proof' /tmp/clinicops-delegation-proof.json
      - name: Custom-agent profile audit
        run: python scripts/audit_agent_profiles.py
      - name: Claim registry audit
        run: python scripts/audit_claim_registry.py
      - name: Claim reference integrity
        run: python scripts/audit_claim_references.py
      - name: Governed content claim validation
        run: python scripts/validate_content_claims.py website
      - name: Sanitized report fixture
        run: python scripts/render_examples.py --check
      - name: Public-copy claim gate
        run: python scripts/claim_gate.py README.md PRIMARY_SOURCES.md docs website examples/portfolio_report.md offers sales research content
