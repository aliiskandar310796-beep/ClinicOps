name: Deploy ClinicOps Site
# Production deploys only from a main-branch commit that CI has fully validated.
# The deploy checks out the EXACT SHA that CI tested (workflow_run.head_sha),
# never the moving tip of main, so a broken or stale generated site state can
# no longer reach production while CI is red (incident: 554463c deployed with
# failing render_public_demo --check on 2026-09-17).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    # Manual deploys exist for deliberate re-deploys and rollback, but they are
    # NOT a validation bypass: a guard step below refuses to deploy any SHA
    # that does not have a successful CI run. Rollback therefore works by
    # dispatching from any previously CI-green ref.

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read  # manual-dispatch guard queries CI run conclusions

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run fires on failure too — only deploy on CI success.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the exact commit CI validated; manual dispatch deploys the
          # chosen ref only after the guard below proves its CI is green.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Manual dispatch guard — refuse any SHA without a successful CI run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "CI conclusion for $sha: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing manual deploy: no successful CI run found for $sha. Production only ever contains CI-validated source."
            exit 1
          fi
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Post-deploy live smoke
        run: |
          sleep 45  # allow Pages CDN to serve the new deployment
          pip install requests
          python scripts/check_live_site.py
