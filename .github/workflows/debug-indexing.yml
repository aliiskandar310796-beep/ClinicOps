name: Debug indexing generators
on:
  push:
    branches:
      - chatgpt/indexing-conversion-20260928
    paths:
      - .github/workflows/debug-indexing.yml

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Render generated discovery files and show diff
        run: |
          python scripts/render_sitemap.py
          python scripts/render_llms_txt.py
          git --no-pager diff -- docs/sitemap.xml docs/llms.txt
