name: Debug public demo generator
on:
  push:
    branches:
      - chatgpt/indexing-conversion-20260928
    paths:
      - .github/workflows/debug-public-demo.yml
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Render and show diff
        run: |
          python scripts/render_public_demo.py
          git --no-pager diff -- docs/transition-map-sample/index.html
