# EUDAMED watchlist monitor (monthly) — anonymised public outputs.
#
# Runs scripts/eudamed_watch.py in LIVE mode against the public EUDAMED JSON API
# for a PRIVATE watchlist supplied at runtime from the EUDAMED_WATCHLIST
# repository secret, then commits the dated snapshot, the diff and LATEST.md,
# only when something changed.
#
# ANONYMISATION: this repository is public. Everything committed here, and
# everything printed to this (public) job log, is aggregate-level only — no
# manufacturer names, device or trade names, Basic UDI-DIs or SS(C)P
# references. Per-device rows in snapshots are keyed by HMAC-SHA256 of the
# Basic UDI-DI under the EUDAMED_HMAC_KEY secret (optional; without it the
# snapshot and diff are aggregate-only). Fully-named reports exist only via the
# local --full-out flag, which this workflow never uses.
#
# Secrets: EUDAMED_WATCHLIST (required; the watchlist JSON — see
# data/eudamed/watchlist.example.json for the format) and EUDAMED_HMAC_KEY
# (optional; any long random string, kept stable across runs).
#
# PUBLIC-API REUSE REVIEW: reviewed 2026-09-12 against the current Commission
# EUDAMED Public API guide, Commission Decision 2011/833/EU and the Commission
# legal notice. The official guide expressly permits public download and
# third-party software integration; no EUDAMED-specific quota/rate condition
# was stated in the reviewed guide. Keep this workflow bounded and polite and
# re-review on 403/429, new published terms, endpoint changes or materially
# higher request volume. See research/eudamed-public-api-reuse-review.md.
#
# Everything this workflow writes is a snapshot of what the public record shows.
# It is never a compliance, conformity or diligence statement about any company.

name: EUDAMED Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: write

concurrency:
  group: clinicops-eudamed-watch
  cancel-in-progress: false

jobs:
  eudamed-watch:
    # Live public-API run with anonymised, aggregate-only committed outputs.
    # Public-API reuse review: research/eudamed-public-api-reuse-review.md.
    name: EUDAMED watchlist snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The tool itself is stdlib-only; pytest is installed only for the self-check.
      - name: Offline self-check against the committed fixture
        run: python -m pip install --quiet pytest && python -m pytest tests/test_eudamed_watch.py -q
      - name: Write private watchlist from repository secret
        env:
          EUDAMED_WATCHLIST: ${{ secrets.EUDAMED_WATCHLIST }}
        run: |
          if [ -z "$EUDAMED_WATCHLIST" ]; then
            echo "::error::The EUDAMED_WATCHLIST repository secret is empty or missing. Create it with the private watchlist JSON (format: data/eudamed/watchlist.example.json)."
            exit 1
          fi
          printf '%s' "$EUDAMED_WATCHLIST" > "$RUNNER_TEMP/watchlist.json"
          python -c "import json,os; json.load(open(os.environ['RUNNER_TEMP'] + '/watchlist.json'))" \
            || { echo "::error::EUDAMED_WATCHLIST is not valid JSON."; exit 1; }
      - name: Run watchlist snapshot (live, read-only, anonymised outputs)
        env:
          EUDAMED_HMAC_KEY: ${{ secrets.EUDAMED_HMAC_KEY }}
        run: |
          python scripts/eudamed_watch.py run \
            --watchlist "$RUNNER_TEMP/watchlist.json" \
            --out data/eudamed/ \
            --max-pages 8 \
            --sleep 1.0
      - name: Add anonymised LATEST.md to job summary
        if: always()
        run: |
          if [ -f data/eudamed/LATEST.md ]; then
            cat data/eudamed/LATEST.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit snapshot, diff and LATEST.md if changed
        run: |
          git config user.name "clinicops-eudamed-watch[bot]"
          git config user.email "clinicops-eudamed-watch[bot]@users.noreply.github.com"
          git add -N data/eudamed
          git diff --quiet || (git add data/eudamed && git commit -m "eudamed-watch: snapshot $(date -u +%F)" && git push)
