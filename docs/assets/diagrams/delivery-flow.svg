<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
<title id="t">Delivery flow</title>
<desc id="d">Inputs (bounded record set, controlled intake, written scope) go into ClinicOps reconciliation, which produces evidence-linked exceptions. A qualified human reviews them, then outputs are produced: source register, reconciliation report, owner queue, evidence packet. A boundary separates machine-detected signal from qualified regulatory determination.</desc>
<style>
svg{font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.s{font-size:18px;fill:#0f1a17}.m{font-size:16px;fill:#556360}.x{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;fill:#0f1a17}
.xm{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;fill:#556360}
.a{fill:#0f5c52}.ab{stroke:#0f5c52}.bd{stroke:#cdd6d1;fill:none;stroke-width:1}.bf{stroke:#cdd6d1;stroke-width:1;fill:#f6f7f5}.ln{stroke:#556360;stroke-width:1.5;fill:none}
.wn{fill:#a55b00}.wb{stroke:#a55b00}.hd{fill:#b03333}.hb{stroke:#b03333}.bold{font-weight:600}
@media (prefers-color-scheme:dark){.s,.x{fill:#e6ece9}.m,.xm{fill:#98a6a1}.a{fill:#4fd8c4}.ab{stroke:#4fd8c4}.bd{stroke:#374541}.bf{stroke:#374541;fill:#0d1211}.ln{stroke:#98a6a1}.wn{fill:#efb05c}.wb{stroke:#efb05c}.hd{fill:#ff9191}.hb{stroke:#ff9191}}
</style>
<text x="16" y="30" class="xm">INPUTS</text>
<text x="266" y="30" class="xm">CLINICOPS</text>
<text x="526" y="30" class="xm">HUMAN REVIEW</text>
<text x="712" y="30" class="xm">OUTPUTS</text>
<rect x="16" y="50" width="226" height="60" rx="5" class="bf"/><text x="30" y="86.0" class="s bold">Bounded record set</text>
<rect x="16" y="126" width="226" height="60" rx="5" class="bf"/><text x="30" y="162.0" class="s bold">Controlled intake</text>
<rect x="16" y="202" width="226" height="60" rx="5" class="bf"/><text x="30" y="238.0" class="s bold">Written scope</text>
<rect x="266" y="50" width="220" height="212" rx="5" class="bf ab"/><text x="280" y="147" class="s bold">Reconciliation</text><text x="280" y="175" class="m">evidence-linked</text><text x="280" y="195" class="m">exceptions</text>
<rect x="526" y="50" width="170" height="212" rx="5" class="bf ab"/><text x="540" y="147" class="s bold">Qualified</text><text x="540" y="175.0" class="m">human review</text>
<rect x="712" y="50" width="232" height="44" rx="5" class="bf"/><text x="726" y="78.0" class="s bold">Source register</text>
<rect x="712" y="104" width="232" height="44" rx="5" class="bf"/><text x="726" y="132.0" class="s bold">Reconciliation report</text>
<rect x="712" y="158" width="232" height="44" rx="5" class="bf"/><text x="726" y="186.0" class="s bold">Owner queue</text>
<rect x="712" y="212" width="232" height="44" rx="5" class="bf"/><text x="726" y="240.0" class="s bold">Evidence packet</text>
<g class="ln"><path d="M242 80H254V156H266"/><path d="M242 156H266"/><path d="M242 232H254V156"/><path d="M486 156H526"/><path d="M696 156H700V72H712M700 156V126H712M700 156V180H712M700 156V234H712"/></g>
<line x1="511" y1="290" x2="511" y2="412" class="ln" stroke-dasharray="5 4"/><line x1="16" y1="290" x2="944" y2="290" class="bd"/>
<text x="16" y="322" class="x bold hd" style="font-size:17px">MACHINE-DETECTED SIGNAL</text><text x="16" y="348" class="m">ClinicOps compares records and flags</text><text x="16" y="370" class="m">differences with linked evidence.</text>
<text x="531" y="322" class="x bold a" style="font-size:17px">QUALIFIED REGULATORY DETERMINATION</text><text x="531" y="348" class="m">Made by a qualified person. ClinicOps</text><text x="531" y="370" class="m">signals do not decide compliance.</text>

</svg>
