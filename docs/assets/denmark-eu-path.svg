<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Denmark to EU market-access evidence path</title><desc id="desc">A clean route from Danish market requirements through controlled localisation and evidence reconciliation to EU-wide operational alignment.</desc><rect width="760" height="420" rx="30" fill="#f7fbfa"/><g font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><text x="54" y="62" fill="#5b6572" font-size="14" font-weight="700" letter-spacing="1.2">DENMARK → EUROPE</text><text x="54" y="96" fill="#1c2430" font-size="26" font-weight="750">Local evidence. EU continuity.</text></g><path d="M94 218H666" stroke="#c5d9d4" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="#0f5c52" stroke-width="3"><circle cx="114" cy="218" r="28"/><circle cx="284" cy="218" r="28"/><circle cx="456" cy="218" r="28"/><circle cx="626" cy="218" r="28"/></g><g fill="#0f5c52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800" font-size="14" text-anchor="middle"><text x="114" y="223">DK</text><text x="284" y="223">LANG</text><text x="456" y="223">EVID</text><text x="626" y="223">EU</text></g><g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" text-anchor="middle"><g fill="#1c2430" font-size="16" font-weight="700"><text x="114" y="278">Authority map</text><text x="284" y="278">Localisation</text><text x="456" y="278">Reconciliation</text><text x="626" y="278">EU operations</text></g><g fill="#5b6572" font-size="13"><text x="114" y="302">Danish sources</text><text x="284" y="302">Danish / English</text><text x="456" y="302">Version + owner</text><text x="626" y="302">MDR · CTIS · AI · EHDS</text></g></g><g fill="#0f5c52"><path d="M176 210l14 8-14 8z"/><path d="M346 210l14 8-14 8z"/><path d="M518 210l14 8-14 8z"/></g><rect x="54" y="342" width="652" height="42" rx="12" fill="#e4f2ef"/><text x="380" y="369" text-anchor="middle" fill="#0a413a" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700">Primary source → controlled content → accountable reviewer → retained closure evidence</text></svg>